name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一次部署，但不中斷進行中的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 壞掉的東西不該被部署出去
      - name: 測試與型別檢查
        run: |
          npm test -- --run
          npx tsc -b --noEmit

      - name: 建置
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 在 repo 的 Settings > Variables 設定 JEV_ENDPOINT，指向自己的 Worker
          VITE_JEV_ENDPOINT: ${{ vars.JEV_ENDPOINT }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
